name: genome-guides
# Pinned to the versions installed on the reference machine on 2026-10-21 (D18). `defaults` is dropped (D18).
# One source of truth per dependency: backend Python packages (FastAPI, DuckDB client, ...) live in apps/backend/pyproject.toml
# + uv.lock only; Redis/Celery/SQLAlchemy/Alembic are removed (D19). The exact solved set is in environment.lock.yml.
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.16
  - nodejs=24.21.0
  - pnpm=12.4.1
  # CLI Bio tools
  - seqkit=2.13.0
  - samtools=1.24
  - bedtools=2.31.1
  - datamash=1.9
  # hecate is built from a pinned upstream commit (D32). Rust is pinned so builds from this env are comparable;
  # the C compiler with OpenMP (libgomp) is taken from the system (upstream INSTALL), not from conda.
  - rust=1.99.0
  # Pipeline scripts (numpy is imported directly by process_hecate_mprob.py)
  - numpy=2.4.6
  - pyarrow=25.0.0
  - duckdb=1.5.5
  - pandas=3.0.5
  - polars=1.44.1
  - pyyaml=6.0.3
  - pytest=9.1.1
  - pip=26.2.1
  - pip:
      - snakemake==9.27.0
      - uv==0.12.15
