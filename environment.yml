name: genome-guides
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - nodejs>=22
  - pnpm>=9.0
  # CLI Bio tools
  - seqkit>=2.8.0
  - samtools>=1.19
  - bedtools>=2.31
  - datamash>=1.8
  # Data & Backend core
  - pyarrow>=14.0
  - duckdb>=0.9
  - pandas>=2.1
  - pyyaml>=6.0
  - pip
  - pip:
      - snakemake
      - uv>=0.1.0
      - fastapi>=0.110.0
      - uvicorn[standard]>=0.28.0
      - sqlalchemy>=2.0.0
      - pydantic>=2.6.0
      - pydantic-settings>=2.2.0
      - alembic>=1.13.0
      - celery>=5.3.6
      - redis>=5.0.0
      - python-json-logger>=2.0.7
