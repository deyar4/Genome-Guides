# Genome Guides - Pipeline Configuration

data_dir: "data"
raw_dir: "data/raw"
interim_dir: "data/interim"
tracks_dir: "data/tracks"

defaults:
  # 1 kb balances local sequence variation against browser-scale track size.
  window_size: 1000
  step_size: 1000
  threads: 4
  mem_mb: 2048

resources:
  downloads:
    threads: 1
    mem_mb: 512
  lightweight:
    threads: 1
    mem_mb: 1024
  analytical:
    threads: 4
    mem_mb: 2048
  hecate:
    threads: 4
    mem_mb: 8192

tracks:
  gc_content:
    enabled: true
    window_size: 1000
    step_size: 1000
  shannon_entropy:
    window_size: 1000
    # Window entropy is NA when fewer than this fraction of window_size bases are A/C/G/T (audit S8).
    min_acgt_fraction: 0.5
  hecate_bwt:
    enabled: false
    # Match the probability track's local entropy resolution without large batches.
    kmer_length: 21
    window_size: 100
    chunk_windows: 1000
    # Pinned hecate build (D32, D34). Temporary: the build source is this repository's own history, commit a097cf1
    # (the vendored copy, which streams --mprob output). Upstream trunk 76b4836 holds all probabilities in RAM
    # (about 12.5 GB for T2T) and ran out of memory. Switch repo/commit/subdir to upstream once it takes the
    # streaming patch. The binary is not tracked in git; if absent the workflow builds it (needs git, Rust, a C
    # compiler with OpenMP). The reported version is "1.0" for every commit, so commit and hash are the identity.
    # The hash is always recorded in data/interim/hecate_binary.txt; a mismatch only warns (another toolchain can
    # differ) unless strict_hash is true (reference machine, Docker image).
    strict_hash: false
    repo: "."
    subdir: "packages/hecate"
    commit: "a097cf1d08d70f917d2e52b5ab6a9149c4874ccd"
    binary: "tools/hecate/hecate"
    # sha256 of the binary per platform, from packages/pipeline/scripts/common/build_hecate.sh (path-independent).
    sha256:
      linux-x86_64: "b2eed68c12dcdddfae4ef067dfd3b217b92d1cf289803b3acd34c8a2d2b6acfc"
  ssr:
    enabled: true
    # 1 Mb bins support genome-wide enrichment comparisons without dense output.
    window_size: 1000000
    # Four million bases bounds regex working memory on 16 GB laptops.
    chunk_bases: 4000000
    min_period: 1
    max_period: 6
  isochores:
    enabled: true
    # Classical GC boundaries used by the L1/L2/H1/H2/H3 classification.
    thresholds: [37, 41, 46, 53]
