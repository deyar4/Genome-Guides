# Genome Guides - Pipeline Configuration

data_dir: "data"
raw_dir: "data/raw"
interim_dir: "data/interim"
tracks_dir: "data/tracks"

# Reference inputs (D1, D18). sha256 = hash of the bytes written to data/raw (after gunzip for the FASTA), taken from the
# files that produced the thesis results (trust on first use, 2026-10-21; not upstream-published checksums).
# scripts/common/fetch_verified.py refuses to create the output when the hash differs.
reference:
  chrm_fasta:  # UCSC hg38 chrM: development smoke test only (D30), never feeds thesis numbers
    url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chrM.fa.gz"
    sha256: "03a7248a919bf68ed2bd9e779e064501d15b8e83f53cc456d529aa4edc3cd3ac"
  t2t_fasta:
    url: "https://s3-us-west-2.amazonaws.com/human-pangenomics/T2T/CHM13/assemblies/analysis_set/chm13v2.0.fa.gz"
    sha256: "15a4ba1246f6021a89699bf5083da7f2bad3f79c86acd7bc1eb0ca3a13164e85"
  t2t_gtf:
    url: "https://hgdownload.soe.ucsc.edu/goldenPath/hs1/bigZips/genes/hs1.ncbiRefSeq.gtf.gz"
    sha256: "d7c2989ca3e0602b7d46d52e42ed85ad1d03be4e8a25e04df2457f74e0e1bb74"
  t2t_centromeres:  # GenomeFeature annotation (SD, SAT, CEN, TEL, rDNA), not only centromeres
