# Calibration inputs for scripts/checks/cpg_calibration.py (Q3 in PROFESSOR_QUESTIONS). UCSC hg38 chr21/chr22 only; they never
# feed thesis tracks and do not change the T2T reference (D1). sha256 of the downloaded .gz bytes, trust on first use (2026-10-22).
calibration:
  hg38_chr21:
    url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chr21.fa.gz"
    sha256: "c979ca1e5065c2521a50773473e0d0cc018fd6f3e9bb3aa90493fe7b45d57d1b"
  hg38_chr22:
    url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/chromosomes/chr22.fa.gz"
    sha256: "05f9d97d6fbfd08a44ca45b50837ca2ae9c471f35ba79dffec04d2cb5eaaf695"
  hg38_cpg_islands:  # UCSC cpgIslandExt, made by a modified cpg_lh program (unpublished); parameters not checked
    url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/database/cpgIslandExt.txt.gz"
    sha256: "2339f8bad0ec9993211287b319b8d59ddeff30a5010505f649817332ed8222f8"
  hg38_rmsk:  # 156 MB, whole genome; filtered to chr21/chr22 by the script, the .gz is kept only for the hash
    url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/database/rmsk.txt.gz"
    sha256: "db60e6aa7ac175f8f5465cd01b48b550e67e1fb0fd828608d8343481867bb276"

defaults:
  # 1 kb balances local sequence variation against browser-scale track size.
  window_size: 1000
  step_size: 1000
  threads: 4
  mem_mb: 2048

resources:
  downloads:
    threads: 1
    mem_mb: 512
  lightweight:
    threads: 1
    mem_mb: 1024
  analytical:
    threads: 4
    mem_mb: 2048
  hecate:
    threads: 4
    mem_mb: 8192

tracks:
  # CpG islands (spec docs/analyses/01_cpg_islands.md). min_gc (percent) and min_oe are STRICT lower bounds (classical
  # wording: GC > 50 %, obs/exp > 0.6); the strict_min_* values are INCLUSIVE (>=). Rationals are exact, never floats.
  cpg_islands:
    window: 200
    min_gc: "50"
    min_oe: "3/5"
    min_length: 200
    strict_min_length: 500
    strict_min_gc: "55"
    strict_min_oe: "13/20"
    # Bases read per block (memory knob, does not change results).
    block_bases: 16000000
    # Seed of the 200-island sample recounted from the FASTA by scripts/checks/cpg_island_recount.py.
    recount_seed: 20261022
  # gc_content and the hecate cross-entropy track use a fixed 1000 bp grid (D31): `-W 1000` in trivial_cli.smk and `-w 1000`
  # in dna.smk. They are literals, not config, so no key here can silently disagree with the results.
  shannon_entropy:
    window_size: 1000
    # Window entropy is NA when fewer than this fraction of window_size bases are A/C/G/T (audit S8).
    min_acgt_fraction: 0.5
  hecate_bwt:
    # Windows per processing batch of the hecate stream (memory knob, does not change results).
    chunk_windows: 1000
    # Pinned hecate build (D32, D35): upstream trunk 76b4836 plus packages/pipeline/patches/hecate-mprob-streaming.patch.
    # Without the patch, upstream keeps every --mprob probability in RAM (about 12.5 GB for T2T) and ran out of
    # memory; the patch drains them from a writer thread. The binary is not tracked in git; if absent the workflow
    # builds it (needs git, network, Rust, a C compiler with OpenMP). The reported version is "1.0" for every commit,
    # so commit, patch and hash are the identity. The hash is always recorded in data/interim/hecate_binary.txt;
    # a mismatch only warns (another toolchain can differ) unless strict_hash is true (reference machine, Docker).
    strict_hash: false
    # Required expected model class per genome (D40, audit 03 S3). Hecate's model class follows the first block, and the same
    # sequence gets different probabilities alone and inside a larger file, so tracks of different classes are not comparable.
    # Genomes not listed here skip the check (small test genomes).
    model_class:
      t2t: "markov"
    repo: "https://gitlab.com/rahmannlab/hecate.git"
    subdir: "."
    commit: "76b48360b52130b9e6149a1c90984d4ed74757f3"
    patches:
      - "packages/pipeline/patches/hecate-mprob-streaming.patch"
    binary: "tools/hecate/hecate"
    # sha256 of the binary per platform, built by build_hecate.sh inside the genome-guides env (rust=1.99.0 from
    # environment.yml, system gcc 16.2.1). The build is path-independent. A system Rust 1.99.1 gave ca949a90...6209.
    # Output of both builds is identical on the test FASTA; only the bytes of the binary differ.
    sha256:
      linux-x86_64: "561c4cea9566088b5a0166e29b9d7c7944e44ad1c8c9a94a0e369cd4ad8b3c5d"
  ssr:
    # Four million bases bounds regex working memory on 16 GB laptops.
    chunk_bases: 4000000
  # Isochore-like classes: thresholds 37/41/46/53 (% GC) are hardcoded in scripts/dna/extract_isochores.py and applied to
  # 1 kb windows, which is a GC-class run, not a literature isochore (audit 03 S10, open).
