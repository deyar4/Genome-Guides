# Genome Guides - Pipeline Configuration

data_dir: "data"
raw_dir: "data/raw"
interim_dir: "data/interim"
tracks_dir: "data/tracks"

defaults:
  # 1 kb balances local sequence variation against browser-scale track size.
  window_size: 1000
  step_size: 1000
  threads: 4
  mem_mb: 2048

resources:
  downloads:
    threads: 1
    mem_mb: 512
  lightweight:
    threads: 1
    mem_mb: 1024
  analytical:
    threads: 4
    mem_mb: 2048
  hecate:
    threads: 4
    mem_mb: 8192

tracks:
  # gc_content and the hecate cross-entropy track use a fixed 1000 bp grid (D31): `-W 1000` in trivial_cli.smk and `-w 1000`
  # in dna.smk. They are literals, not config, so no key here can silently disagree with the results.
  shannon_entropy:
    window_size: 1000
    # Window entropy is NA when fewer than this fraction of window_size bases are A/C/G/T (audit S8).
    min_acgt_fraction: 0.5
  hecate_bwt:
    # Windows per processing batch of the hecate stream (memory knob, does not change results).
    chunk_windows: 1000
    # Pinned hecate build (D32, D35): upstream trunk 76b4836 plus packages/pipeline/patches/hecate-mprob-streaming.patch.
    # Without the patch, upstream keeps every --mprob probability in RAM (about 12.5 GB for T2T) and ran out of
    # memory; the patch drains them from a writer thread. The binary is not tracked in git; if absent the workflow
    # builds it (needs git, network, Rust, a C compiler with OpenMP). The reported version is "1.0" for every commit,
    # so commit, patch and hash are the identity. The hash is always recorded in data/interim/hecate_binary.txt;
    # a mismatch only warns (another toolchain can differ) unless strict_hash is true (reference machine, Docker).
    strict_hash: false
    repo: "https://gitlab.com/rahmannlab/hecate.git"
    subdir: "."
    commit: "76b48360b52130b9e6149a1c90984d4ed74757f3"
    patches:
      - "packages/pipeline/patches/hecate-mprob-streaming.patch"
    binary: "tools/hecate/hecate"
    # sha256 of the binary per platform, built by build_hecate.sh inside the genome-guides env (rust=1.99.0 from
    # environment.yml, system gcc 16.2.1). The build is path-independent. A system Rust 1.99.1 gave ca949a90...6209.
    # Output of both builds is identical on the test FASTA; only the bytes of the binary differ.
    sha256:
      linux-x86_64: "561c4cea9566088b5a0166e29b9d7c7944e44ad1c8c9a94a0e369cd4ad8b3c5d"
  ssr:
    # 1 Mb bins support genome-wide enrichment comparisons without dense output.
    window_size: 1000000
    # Four million bases bounds regex working memory on 16 GB laptops.
    chunk_bases: 4000000
  # Isochore-like classes: thresholds 37/41/46/53 (% GC) are hardcoded in scripts/dna/extract_isochores.py and applied to
  # 1 kb windows, which is a GC-class run, not a literature isochore (audit 03 S10, open).
