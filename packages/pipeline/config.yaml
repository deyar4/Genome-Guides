# Genome Guides - Pipeline Configuration

data_dir: "data"
raw_dir: "data/raw"
interim_dir: "data/interim"
tracks_dir: "data/tracks"

defaults:
  window_size: 1000
  step_size: 1000
  threads: 4
  mem_mb: 2048

resources:
  downloads:
    threads: 1
    mem_mb: 512
  lightweight:
    threads: 1
    mem_mb: 1024
  analytical:
    threads: 4
    mem_mb: 2048
  hecate:
    threads: 4
    mem_mb: 8192

tracks:
  gc_content:
    enabled: true
    window_size: 1000
    step_size: 1000
  hecate_bwt:
    enabled: false
    kmer_length: 21
    window_size: 100
  ssr:
    enabled: true
    window_size: 1000000
    chunk_bases: 4000000
    min_period: 1
    max_period: 6
  isochores:
    enabled: true
    thresholds: [37, 41, 46, 53]
