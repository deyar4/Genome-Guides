    sha256: "740f65e772bbbfc7e96d0f03b589a492b887aeb1a153b633cd308fcfcce5fdad"
  t2t_protein:
    url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/009/914/755/GCF_009914755.1_T2T-CHM13v2.0/GCF_009914755.1_T2T-CHM13v2.0_protein.faa.gz"
    sha256: "e91e007af2497ecf52916b1dffaee3ec8b39e3688de1f8a5b3d998abbe7ecaf8"
